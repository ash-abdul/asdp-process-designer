name: CI

on:
  push:
    branches: ["**"]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: typecheck · architecture · tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22.x"
          cache: npm

      - name: Install (locked)
        run: npm ci

      - name: Typecheck (strict)
        run: npm run typecheck

      # Architectural invariants are enforced mechanically, not by review.
      - name: Architecture checks
        run: npm run check:arch

      # Proves the checker actually fires — a checker that never fails is worse
      # than no checker (phase-0-tasks A3/A5).
      - name: Architecture checker self-test
        run: npm run check:arch:selftest

      - name: Tests
        run: npm test

  docs:
    name: documentation consistency
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22.x"
      - name: Internal link check
        run: node tools/check-docs.mjs
